name: Tests Robot Framework (navigateur)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer Robot Framework
        run: pip install -r requirements.txt

      - name: Installer le navigateur de test
        run: rfbrowser init chromium --with-deps

      - name: Lancer les tests
        run: robot tests.robot

      - name: Sauvegarder les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-robot
          path: |
            report.html
            log.html
            output.xml
            browser/
